name: GFZE01 progress report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    # The runner is SELF-HOSTED: it keeps the retail DOL and MWCC outside
    # GitHub, and a job on it executes on a personal machine. So a pull
    # request only builds when its head branch lives in THIS repository.
    # A fork PR creates the job and GitHub skips it before any runner sees
    # it, which is the same amount of fork code executed here as before this
    # trigger existed: none. Check a fork PR with a manual run from the
    # Actions tab against its branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, fzero-report]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link private build inputs
        shell: bash
        run: |
          set -euo pipefail
          private="$HOME/projects/fzero-gx-decomp"
          test -d "$HOME/orig"
          test -d "$private/build/compilers"
          mkdir -p build
          for d in compilers binutils; do
            ln -s "$private/build/$d" "build/$d"
          done
          # Ninja may download tools. Never write through to live worker tools.
          cp -aL "$private/build/tools" build/tools
          ln -s "$HOME/orig" orig

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          private="$HOME/projects/fzero-gx-decomp"
          python3 configure.py -v GFZE01 \
            --compilers "$private/build/compilers" \
            --binutils "$private/build/binutils" \
            --dtk "$private/build/tools/dtk" \
            --objdiff "$private/build/tools/objdiff-cli" \
            --wrapper build/tools/wibo \
            --sjiswrap build/tools/sjiswrap.exe configure
          # all_source, not just the DOL: an Object(NonMatching, ...) unit is
          # never linked, so the DOL target does not build its object and the
          # report would score it as unbuilt. all_source compiles every unit
          # that has a source file, which is what objdiff diffs against.
          ninja all_source build/GFZE01/main.dol

      - name: Verify retail DOL SHA-1
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk '{print $1}' config/GFZE01/build.sha1)
          actual=$(sha1sum build/GFZE01/main.dol | awk '{print $1}')
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Generate objdiff report
        run: build/tools/objdiff-cli report generate -o build/GFZE01/report.raw.json

      - name: Add mission-aware public metric layer
        run: python3 tools/decomp_report.py --report build/GFZE01/report.raw.json --root . --out build/GFZE01/report.json

      - name: Verify decomp.dev can parse the report
        # objdiff-cli is the same parser decomp.dev ingests with. Without this
        # step a malformed report uploads cleanly, the run goes green, and the
        # site silently keeps serving the last report it could read -- which
        # is exactly what an out-of-schema Measures field did for eleven days
        # from 2026-08-26.
        run: build/tools/objdiff-cli report changes build/GFZE01/report.json build/GFZE01/report.json > /dev/null

      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: GFZE01_report
          path: build/GFZE01/report.json
          if-no-files-found: error

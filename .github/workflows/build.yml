name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # The build image holds game files: never run it for pull requests from other repositories.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A *private* build container holding orig/GFZE01 (with the derived main.rel),
    # the compilers and binutils, owned by whoever owns this repository (rayanht/fzgx-build
    # upstream, karamzov123/fzgx-build on the fork). See docs/github_actions.md.
    container: ghcr.io/${{ github.repository_owner }}/fzgx-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [GFZE01]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times so ninja does not rebuild everything
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # The container carries the extracted retail files (incl. enemy_line/main.rel)
    - name: Prepare
      run: cp -a /orig .

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Partial C bodies scored for decomp.dev's fuzzy match only; exact measures are guarded.
    - name: Fuzzy match
      run: |
        python3 tools/fuzzy_report.py apply --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers \
          || echo "::warning::fuzzy match skipped; the exact report is uploaded"

    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    - name: Upload exact report
      if: hashFiles(format('build/{0}/report.exact.json', matrix.version)) != ''
      uses: actions/upload-artifact@v4
      with:
        # must not match decomp.dev's `<version>_report*` artifact pattern
        name: ${{ matrix.version }}_exact
        path: build/${{ matrix.version }}/report.exact.json

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">F-Zero GX GFZE01 codebase map</title>
  <desc id="desc">main.dol split map feeds Dolphin SDK and F-Zero GX game sources, with reports and tooling around the build.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 600 18px 'DejaVu Sans', sans-serif; fill: #f8fafc; }
      .small { font: 13px 'DejaVu Sans', sans-serif; fill: #cbd5e1; }
      .tiny { font: 12px 'DejaVu Sans', sans-serif; fill: #94a3b8; }
      .box { stroke-width: 2; rx: 12; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#020617"/>
  <rect x="20" y="20" width="1160" height="580" rx="18" fill="url(#grid)" stroke="#334155"/>
  <text x="60" y="70" class="label" font-size="26">F-Zero GX · GFZE01 codebase map</text>
  <text x="60" y="96" class="small">Source-oriented view of the retail main.dol split into readable subsystems</text>

  <path class="edge" d="M600 176V220"/>
  <path class="edge" d="M600 176V220H300V274"/>
  <path class="edge" d="M600 176V220H900V274"/>
  <path class="edge" d="M300 362V420H170V474"/>
  <path class="edge" d="M300 362V420H430V474"/>
  <path class="edge" d="M900 362V420H770V474"/>
  <path class="edge" d="M900 362V420H1030V474"/>

  <rect x="430" y="118" width="340" height="58" class="box" fill="#0c4a6e" stroke="#22d3ee"/>
  <text x="600" y="145" text-anchor="middle" class="label">main.dol · GFZE01</text>
  <text x="600" y="164" text-anchor="middle" class="tiny">retail object and section boundaries</text>

  <rect x="120" y="274" width="360" height="88" class="box" fill="#064e3b" stroke="#34d399"/>
  <text x="300" y="309" text-anchor="middle" class="label">Dolphin SDK / runtime</text>
  <text x="300" y="333" text-anchor="middle" class="small">ai · ax · dvd · gx · os · mtx · vi</text>
  <text x="300" y="351" text-anchor="middle" class="tiny">hardware, OS, graphics, audio, and debug support</text>

  <rect x="720" y="274" width="360" height="88" class="box" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="900" y="309" text-anchor="middle" class="label">F-Zero GX game code</text>
  <text x="900" y="333" text-anchor="middle" class="small">src/game</text>
  <text x="900" y="351" text-anchor="middle" class="tiny">reconstructed game-specific subsystems</text>

  <rect x="65" y="474" width="210" height="70" class="box" fill="#1e293b" stroke="#94a3b8"/>
  <text x="170" y="504" text-anchor="middle" class="label" font-size="16">config/GFZE01</text>
  <text x="170" y="526" text-anchor="middle" class="tiny">symbols · splits · SHA-1</text>

  <rect x="325" y="474" width="210" height="70" class="box" fill="#1e293b" stroke="#94a3b8"/>
  <text x="430" y="504" text-anchor="middle" class="label" font-size="16">src/dolphin</text>
  <text x="430" y="526" text-anchor="middle" class="tiny">SDK and runtime objects</text>

  <rect x="665" y="474" width="210" height="70" class="box" fill="#1e293b" stroke="#94a3b8"/>
  <text x="770" y="504" text-anchor="middle" class="label" font-size="16">src/non_matchings</text>
  <text x="770" y="526" text-anchor="middle" class="tiny">isolated investigations</text>

  <rect x="925" y="474" width="210" height="70" class="box" fill="#1e293b" stroke="#94a3b8"/>
  <text x="1030" y="504" text-anchor="middle" class="label" font-size="16">tools + reports</text>
  <text x="1030" y="526" text-anchor="middle" class="tiny">build · objdiff · decomp.dev</text>

  <text x="60" y="580" class="tiny">The split map is authoritative; this diagram is a navigational overview.</text>
</svg>
